name: Windows MSYS

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      max-parallel: 10
      fail-fast: false
      matrix:
       include:
         - target_arch: x86_64
           compiler: gcc
           upload: 1
         - target_arch: x86_64
           compiler: clang
           upload: 0
    env:
      TARGET_ARCH: ${{ matrix.target_arch }}
      COMPILER: ${{ matrix.compiler }}
      UPLOAD: ${{ matrix.upload }}
      UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
    - uses: actions/checkout@v6
      with:
        # ExtraPlugins is private and optional; fork builds must not require the upstream upload token.
        submodules: false
    - uses: msys2/setup-msys2@v2
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      with:
        update: true
        install: >-
          ccache
          clang
          cmake
          git
          make
          ninja
          pkgconf
          python3
          unzip
          mingw-w64-${{ matrix.target_arch }}-binutils
          mingw-w64-${{ matrix.target_arch }}-ccache
          mingw-w64-${{ matrix.target_arch }}-clang
          mingw-w64-${{ matrix.target_arch }}-cmake
          mingw-w64-${{ matrix.target_arch }}-ffmpeg
          mingw-w64-${{ matrix.target_arch }}-ninja
          mingw-w64-${{ matrix.target_arch }}-pkgconf
          mingw-w64-${{ matrix.target_arch }}-qt6
    - uses: msys2/setup-msys2@v2
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        update: true
        install: >-
          ccache
          clang
          cmake
          git
          make
          ninja
          pkgconf
          python3
          unzip
          mingw-w64-${{ matrix.target_arch }}-binutils
          mingw-w64-${{ matrix.target_arch }}-ccache
          mingw-w64-${{ matrix.target_arch }}-clang
          mingw-w64-${{ matrix.target_arch }}-cmake
          mingw-w64-${{ matrix.target_arch }}-ffmpeg
          mingw-w64-${{ matrix.target_arch }}-ninja
          mingw-w64-${{ matrix.target_arch }}-pkgconf
          mingw-w64-${{ matrix.target_arch }}-portaudio
          mingw-w64-${{ matrix.target_arch }}-qt6
    - name: Install dependencies
      run: ./ports/ci/windows-msys/install_deps.sh
    - name: Release Build
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: ./ports/ci/windows-msys/build.sh
    - name: Release Deploy
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      run: ./ports/ci/windows-msys/deploy.sh
    - name: Daily Build
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        DAILY_BUILD: 1
      run: ./ports/ci/windows-msys/build.sh
    - name: Daily Deploy
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      env:
        DAILY_BUILD: 1
      run: ./ports/ci/windows-msys/deploy.sh
    - name: Upload Windows packages as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: Webcamoid-Windows-${{ matrix.compiler }}-${{ matrix.target_arch }}
        path: webcamoid-packages/windows/*
        if-no-files-found: error
        compression-level: 0
        retention-days: 14
    - name: VirusTotal Scan
      uses: crazy-max/ghaction-virustotal@v4
      if: ${{ matrix.upload && env.VT_API_KEY != '' }}
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        files: |
          webcamoid-packages/windows/*
    - name: Release Upload
      uses: softprops/action-gh-release@v3
      if: ${{ startsWith(github.ref, 'refs/tags/') && matrix.upload && env.UPLOAD_TOKEN != '' }}
      with:
        repository: webcamoid/WebcamoidPrivate
        files: |
          webcamoid-packages/windows/*
        token: ${{ secrets.UPLOAD_TOKEN }}
    - name: Daily Build Upload
      uses: softprops/action-gh-release@v3
      if: ${{ !startsWith(github.ref, 'refs/tags/') && matrix.upload && github.ref == 'refs/heads/master' && env.UPLOAD_TOKEN != '' }}
      with:
        repository: webcamoid/WebcamoidPrivate
        body: "${{ github.event.head_commit.message }} (commit: [${{ github.sha }}](https://github.com/webcamoid/webcamoid/commit/${{ github.sha }}))<hr>**Note**: Ignore the commit information of the tag, the files in the release keep updating with every new build, these packages were built from [${{ github.sha }}](https://github.com/webcamoid/webcamoid/commit/${{ github.sha }}) commit."
        prerelease: true
        files: |
          webcamoid-packages/windows/*
        name: Daily Build
        tag_name: daily-build
        token: ${{ secrets.UPLOAD_TOKEN }}
