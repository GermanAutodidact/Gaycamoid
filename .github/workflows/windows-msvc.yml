name: Windows x64 Build

on:
  push:
  workflow_dispatch:

env:
  QTVER: 6.10.2
  FFMPEG_VERSION: 8.0.1
  CMAKE_GENERATOR: Visual Studio 17 2022

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2022
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Install dependencies
        shell: cmd
        run: ports\ci\windows-msvc\install_deps.bat

      - name: Build release binaries
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: cmd
        run: ports\ci\windows-msvc\build.bat

      - name: Build daily binaries
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: cmd
        env:
          DAILY_BUILD: 1
        run: ports\ci\windows-msvc\build.bat

      - name: Create Windows installer and ZIP
        shell: cmd
        run: ports\ci\windows-msvc\deploy.bat

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: Webcamoid-Windows-x64
          path: webcamoid-packages/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
